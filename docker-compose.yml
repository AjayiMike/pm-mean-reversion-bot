services:
  app:
    build: .
    env_file:
      - .env
    command: python -m polymarket_scalper
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  recorder:
    build: .
    env_file:
      - .env
    command: python -m polymarket_scalper record-once
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  test:
    build: .
    env_file:
      - .env
    command: python -m pytest
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polymarket_scalper}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-polymarket_scalper}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
