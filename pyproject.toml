[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "polymarket-scalper"
version = "0.2.0"
description = "Phase 2 market data recorder for a Polymarket 15-minute crypto mean-reversion scalping bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary]>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.4.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_scalper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
